name: Build APK

on:
  push:
    branches: [main, master]
    # Pushing a version tag (git push origin v1.6.0) also publishes a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Optional: add these repository secrets so every build is signed with the same key
      # (needed to install updates over an existing install). See README.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Show signing certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set: this APK uses a throwaway debug key and can't update an installed copy."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: harmonic-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Runs only for version tags: publishes the APK as a GitHub Release, which the app's
  # "Check for updates" looks at. Release notes come from the matching CHANGELOG.md section.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: harmonic-release-apk
          path: apk

      - name: Refuse unsigned releases
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing: a debug-signed APK can't update installed copies."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # The "## [VERSION]" section of the changelog, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Harmonic $VERSION" > notes.md
          APK="harmonic-$VERSION.apk"
          cp "$(ls apk/*.apk | head -1)" "$APK"
          gh release create "$TAG" "$APK" --title "Harmonic $VERSION" --notes-file notes.md --verify-tag
